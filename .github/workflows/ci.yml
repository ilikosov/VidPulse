name: CI

# Run the test suite on every pull request (and on pushes to main).
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type check (tsc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build @vidpulse/config
        run: npm run build -w @vidpulse/config

      - name: Build @vidpulse/db
        run: npm run build -w @vidpulse/db

      - name: Build @vidpulse/kpop-sources
        run: npm run build -w @vidpulse/kpop-sources

      - name: Build @vidpulse/parser
        run: npm run build -w @vidpulse/parser

      - name: Type check server
        run: npm run build -w apps/server

  test:
    name: Backend tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build @vidpulse/config
        run: npm run build -w @vidpulse/config

      - name: Build @vidpulse/db
        run: npm run build -w @vidpulse/db

      - name: Build @vidpulse/kpop-sources
        run: npm run build -w @vidpulse/kpop-sources

      - name: Build @vidpulse/parser
        run: npm run build -w @vidpulse/parser

      - name: Run tests
        run: npm test
