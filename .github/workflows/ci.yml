name: CI

# Run the test suite on every pull request (and on pushes to main).
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type check (tsc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check server
        run: npm run build -w apps/server

  test:
    name: Backend tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env.test
        run: printf 'DATABASE_PATH=/tmp/ci-dev.sqlite3\nTEST_DATABASE_PATH=/tmp/ci-test.sqlite3\n' > .env.test

      - name: Run tests
        run: npm test
